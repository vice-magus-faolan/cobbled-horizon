name: Validate pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v

      - name: Install pinned packwiz revision
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      - name: Verify packwiz index is current
        run: |
          packwiz refresh --build
          git diff --exit-code -- pack.toml index.toml

      - name: Export and validate mrpack
        run: |
          mkdir -p dist
          packwiz modrinth export -o dist/cobbled-horizon-0.1.0+mc26.2.mrpack
          python3 scripts/validate_mrpack.py \
            dist/cobbled-horizon-0.1.0+mc26.2.mrpack \
            --minecraft 26.2

      - name: Upload validated mrpack
        uses: actions/upload-artifact@v7
        with:
          name: cobbled-horizon-mc26.2
          path: dist/cobbled-horizon-0.1.0+mc26.2.mrpack
          if-no-files-found: error
          retention-days: 14
