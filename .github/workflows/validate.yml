name: Build and release pack

on:
  push:
    branches: ['26.2', '26.3']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Read version and verify release tag
        id: metadata
        shell: bash
        env:
          VERSION_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          else
            args+=(--expected-minecraft "$VERSION_BRANCH")
          fi
          python3 scripts/release_metadata.py "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Install pinned packwiz revision
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e

      - name: Test repository tooling
        # Pins, validators and exports share one contract: run the full PR suite.
        run: python3 -m unittest discover -s tests -v

      - name: Verify packwiz index is current
        run: |
          packwiz refresh --build
          git diff --exit-code -- pack.toml index.toml

      - name: Export and validate all three pack archives
        run: |
          make release
          git diff --exit-code -- pack.toml index.toml

      - name: Upload validated release files
        uses: actions/upload-artifact@v7
        with:
          name: cobbled-horizon-${{ steps.metadata.outputs.version }}
          path: |
            dist/cobbled-horizon-${{ steps.metadata.outputs.version }}.mrpack
            dist/cobbled-horizon-${{ steps.metadata.outputs.version }}.zip
            dist/cobbled-horizon-${{ steps.metadata.outputs.version }}-server.zip
            dist/cobbled-horizon-${{ steps.metadata.outputs.version }}.sha256
          if-no-files-found: error
          retention-days: 14

  native-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NATIVE_PROJECT: ch-native-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out matching source
        id: source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download this run validated release files
        uses: actions/download-artifact@v8
        with:
          name: cobbled-horizon-${{ needs.validate.outputs.version }}
          path: dist

      - name: Pull pinned Java 25 runtime
        timeout-minutes: 2
        run: docker pull eclipse-temurin:25-jdk@sha256:b8705e936964c228dfce359e63dbf08f6c69cb380ed1d576b1f6b1064f15567d

      - name: Verify native first-install and restart acceptance
        timeout-minutes: 13
        env:
          PACK_VERSION: ${{ needs.validate.outputs.version }}
          NATIVE_WORK: ${{ runner.temp }}/ch-native-${{ github.run_id }}-${{ github.run_attempt }}
          NATIVE_EVIDENCE: ${{ runner.temp }}/ch-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/native_acceptance.py run --project "$NATIVE_PROJECT" \
            --archive "dist/cobbled-horizon-$PACK_VERSION-server.zip" \
            --work "$NATIVE_WORK" --evidence "$NATIVE_EVIDENCE"

      - name: Remove and verify absence of owned resources
        if: always() && steps.source.outcome == 'success'
        timeout-minutes: 2
        run: python3 scripts/native_acceptance.py cleanup --project "$NATIVE_PROJECT"

      - name: Upload bounded native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-acceptance-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/ch-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, native-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@v8
        with:
          name: cobbled-horizon-${{ needs.validate.outputs.version }}
          path: dist

      - name: Create and publish GitHub release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          basename="cobbled-horizon-$RELEASE_VERSION"
          assets=("$basename.mrpack" "$basename.zip" "$basename-server.zip" "$basename.sha256")
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          shopt -s nullglob dotglob
          files=(*)
          if (( ${#files[@]} != ${#assets[@]} )); then
            echo "Unexpected release file set; refusing publication."
            exit 1
          fi
          sha256sum --check "$basename.sha256"
          # Upload into a draft so failed uploads never publish a partial release.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Cobbled Horizon $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq \
            'if all(.assets[]; .size > 0) then .assets | map(.name) | sort | .[] else error("empty release asset") end')
          expected=$(printf '%s\n' "${assets[@]}" | sort)
          if [[ "$uploaded" != "$expected" ]]; then
            echo "Uploaded release assets differ; leaving the release in draft."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
